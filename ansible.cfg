# Ansible Core Global Configuration File
[defaults]
# Default inventory location
inventory = ./inventories/production/hosts.ini

# Path to search for Ansible Roles
roles_path = ./roles

# Number of parallel processes to use when communicating with remote hosts
forks = 10

# Default remote user for SSH connections
remote_user = ubuntu

# Host key checking (Set to False for automated lab environments)
host_key_checking = False

# Enable fact caching to speed up playbook runs
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_fact_cache
fact_caching_timeout = 86400

# Callback plugins for clean terminal output formatting
stdout_callback = default
bin_ansible_callbacks = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Enable SSH pipelining to reduce SSH operations and drastically speed up execution
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
