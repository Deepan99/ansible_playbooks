# Ansible Production Inventory (INI Format)

[webservers]
web01.production.internal ansible_host=192.168.10.10 ansible_user=ubuntu
web02.production.internal ansible_host=192.168.10.11 ansible_user=ubuntu

[dbservers]
db01.production.internal ansible_host=192.168.20.15 ansible_user=postgres

[loadbalancers]
lb01.production.internal ansible_host=192.168.10.5 ansible_user=ubuntu

# Group of groups (Parent Group)
[lamp_stack:children]
webservers
dbservers

# Group variables applied to all webservers
[webservers:vars]
http_port=80
https_port=443
max_keepalive_requests=100

# Global variables applied across all target hosts
[all:vars]
ansible_python_interpreter=/usr/bin/python3
environment_name=production

# ─────────────────────────────────────────────────────────────
# LAB INFRASTRUCTURE — Real nodes (192.168.224.0/24 subnet)
# ─────────────────────────────────────────────────────────────

[k8s_master]
awx-master  ansible_host=192.168.224.129  ansible_user=ansible_svc

[infra]
infra-node  ansible_host=192.168.224.131  ansible_user=ansible_svc

[execution_nodes]
exec-node   ansible_host=192.168.224.130  ansible_user=ansible_svc

# Parent group containing all lab nodes
[lab:children]
k8s_master
infra
execution_nodes

[lab:vars]
ansible_python_interpreter=/usr/bin/python3
