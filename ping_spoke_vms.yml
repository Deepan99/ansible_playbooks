---
- name: Zero-Trust ARM API Management across ALL Azure Spoke VMs (No SSH / No CLI)
  hosts: localhost
  connection: local
  gather_facts: no
  collections:
    - azure.azcollection
  vars:
    target_resource_group: "rg-spoke-eastus"

  tasks:
    - name: Dynamically discover all VMs in Resource Group
      azure_rm_virtualmachine_info:
        resource_group: "{{ target_resource_group }}"
      register: azure_vms

    - name: Execute command on ALL discovered VMs via Direct ARM REST API
      azure_rm_resource:
        resource_group: "{{ target_resource_group }}"
        provider: Compute
        resource_type: virtualMachines
        resource_name: "{{ item.name }}"
        subresource:
          - type: runCommand
        api_version: "2023-03-01"
        method: POST
        body:
          commandId: RunShellScript
          script:
            - hostname
            - uptime
      loop: "{{ azure_vms.vms }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_outputs

    - name: Display execution results for each VM
      ansible.builtin.debug:
        msg: "VM: {{ item.item.name }} | Output: {{ item.response.value[0].message }}"
      loop: "{{ vm_outputs.results }}"
      loop_control:
        label: "{{ item.item.name }}"
