---
- name: Azure Infrastructure Health & Connectivity Audit
  hosts: all
  gather_facts: true
  become: false

  vars:
    warning_disk_percent: 80
    critical_disk_percent: 90
    warning_memory_percent: 80
    critical_memory_percent: 90

  tasks:
    - name: 1. Verify SSH Connectivity
      ansible.builtin.ping:
      register: ping_result

    - name: 2. Check Host Uptime
      ansible.builtin.shell: |
        uptime -p
      register: uptime_output
      changed_when: false

    - name: 3. Check System Load Average
      ansible.builtin.shell: |
        cat /proc/loadavg | awk '{print "1min: " $1 " | 5min: " $2 " | 15min: " $3}'
      register: loadavg_output
      changed_when: false

    - name: 4. Check CPU Core Count
      ansible.builtin.shell: |
        nproc
      register: cpu_cores
      changed_when: false

    - name: 5. Check Memory Usage Details
      ansible.builtin.shell: |
        free -h | awk 'NR==2{printf "Used: %s / Total: %s (%.1f%%)", $3,$2,$3*100/$2 }'
      register: memory_output
      changed_when: false

    - name: 6. Check Swap Usage
      ansible.builtin.shell: |
        free -h | awk 'NR==3{if($2!="0B") printf "Swap Used: %s / Total: %s (%.1f%%)", $3,$2,$3*100/$2; else print "Swap: Disabled"}'
      register: swap_output
      changed_when: false

    - name: 7. Check Disk Space on All Partitions
      ansible.builtin.shell: |
        df -h | awk 'NR>1 {printf "%-20s %5s / %5s (%3s used) - %s free\n", $6, $3, $2, $5, $4}'
      register: disk_output
      changed_when: false

    - name: 8. Check Root Partition Usage Percentage
      ansible.builtin.shell: |
        df / | awk 'NR==2 {print $5}' | sed 's/%//'
      register: root_disk_percent
      changed_when: false

    - name: 9. Check Network Interfaces
      ansible.builtin.shell: |
        ip -4 addr show | grep -E "inet|^[0-9]" | awk '{print $2 " " $NF}' | head -20
      register: network_interfaces
      changed_when: false
      ignore_errors: true

    - name: 10. Check Active Network Connections
      ansible.builtin.shell: |
        ss -tun | awk 'NR>1 {print $1 " " $5}' | sort | uniq -c | sort -rn | head -10
      register: network_connections
      changed_when: false
      ignore_errors: true

    - name: 11. Check Running Processes Count
      ansible.builtin.shell: |
        ps aux | wc -l
      register: process_count
      changed_when: false

    - name: 12. Check Top 5 CPU Consuming Processes
      ansible.builtin.shell: |
        ps aux --sort=-%cpu | head -6 | awk '{printf "%-10s %6s %6s %s\n", $1, $3"%", $4"%", $11}'
      register: top_cpu_processes
      changed_when: false

    - name: 13. Check Top 5 Memory Consuming Processes
      ansible.builtin.shell: |
        ps aux --sort=-%mem | head -6 | awk '{printf "%-10s %6s %6s %s\n", $1, $3"%", $4"%", $11}'
      register: top_mem_processes
      changed_when: false

    - name: 14. Check Systemd Service Failures
      ansible.builtin.shell: |
        systemctl list-units --state=failed --no-pager --plain | head -10
      register: failed_services
      changed_when: false
      ignore_errors: true

    - name: 15. Check Time Synchronization (NTP)
      ansible.builtin.shell: |
        timedatectl status | grep -E "System clock synchronized|NTP service"
      register: ntp_status
      changed_when: false
      ignore_errors: true

    - name: 16. Check Recent System Errors (last 50 lines)
      ansible.builtin.shell: |
        journalctl -p err -n 50 --no-pager | tail -10
      register: recent_errors
      changed_when: false
      ignore_errors: true

    - name: 17. Check Available Security Updates
      ansible.builtin.shell: |
        if command -v apt-get &> /dev/null; then
          apt list --upgradable 2>/dev/null | grep -i security | wc -l
        elif command -v yum &> /dev/null; then
          yum check-update --security 2>/dev/null | grep -c "security" || echo "0"
        else
          echo "N/A"
        fi
      register: security_updates
      changed_when: false
      ignore_errors: true

    - name: 18. Check Kernel Version
      ansible.builtin.shell: |
        uname -r
      register: kernel_version
      changed_when: false

    - name: 19. Check Logged-in Users
      ansible.builtin.shell: |
        who
      register: logged_users
      changed_when: false

    - name: 20. Check Last 10 System Boot Times
      ansible.builtin.shell: |
        last reboot | head -10
      register: reboot_history
      changed_when: false
      ignore_errors: true

    - name: Set Disk Status
      ansible.builtin.set_fact:
        disk_status: "{{ 'CRITICAL' if root_disk_percent.stdout|int >= critical_disk_percent else 'WARNING' if root_disk_percent.stdout|int >= warning_disk_percent else 'OK' }}"

    - name: Display Comprehensive Host Health Summary
      ansible.builtin.debug:
        msg:
          - "========================================================================================================"
          - "🔍 AZURE INFRASTRUCTURE HEALTH AUDIT REPORT"
          - "========================================================================================================"
          - ""
          - "📡 CONNECTIVITY"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  SSH Status:          {{ '✅ CONNECTED' if ping_result.ping == 'pong' else '❌ FAILED' }}"
          - "  Hostname:            {{ ansible_hostname }}"
          - "  IP Address:          {{ ansible_default_ipv4.address | default('N/A') }}"
          - "  FQDN:                {{ ansible_fqdn | default('N/A') }}"
          - ""
          - "🖥️  SYSTEM INFORMATION"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  OS:                  {{ ansible_distribution }} {{ ansible_distribution_version }}"
          - "  Kernel:              {{ kernel_version.stdout }}"
          - "  Architecture:        {{ ansible_architecture }}"
          - "  Virtualization:      {{ ansible_virtualization_type | default('N/A') }}"
          - ""
          - "⏱️  SYSTEM UPTIME & LOAD"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  Uptime:              {{ uptime_output.stdout }}"
          - "  Load Average:        {{ loadavg_output.stdout }}"
          - "  CPU Cores:           {{ cpu_cores.stdout }}"
          - ""
          - "💾 MEMORY STATUS"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  Memory Usage:        {{ memory_output.stdout }}"
          - "  {{ swap_output.stdout }}"
          - "  Total RAM:           {{ (ansible_memtotal_mb / 1024) | round(2) }} GB"
          - ""
          - "💽 DISK SPACE ({{ disk_status }})"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "{{ disk_output.stdout.split('\n') }}"
          - ""
          - "🌐 NETWORK STATUS"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  Network Interfaces:"
          - "{{ network_interfaces.stdout.split('\n') | default(['N/A']) }}"
          - "  Top Connections:"
          - "{{ network_connections.stdout.split('\n') | default(['N/A']) }}"
          - ""
          - "⚙️  PROCESS & SERVICES"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  Total Processes:     {{ process_count.stdout }}"
          - "  Top CPU Processes:"
          - "{{ top_cpu_processes.stdout.split('\n') }}"
          - "  Top Memory Processes:"
          - "{{ top_mem_processes.stdout.split('\n') }}"
          - ""
          - "🔧 SERVICES & SYSTEM"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  Failed Services:"
          - "{{ failed_services.stdout.split('\n') | default(['No failed services']) }}"
          - "  NTP Status:"
          - "{{ ntp_status.stdout.split('\n') | default(['N/A']) }}"
          - ""
          - "👥 USER ACTIVITY"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  Logged-in Users:"
          - "{{ logged_users.stdout.split('\n') | default(['No users logged in']) }}"
          - ""
          - "📊 SECURITY & UPDATES"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "  Security Updates:    {{ security_updates.stdout }} pending"
          - ""
          - "📝 RECENT REBOOTS"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "{{ reboot_history.stdout.split('\n') | default(['No reboot history available']) }}"
          - ""
          - "⚠️  RECENT SYSTEM ERRORS (last 10)"
          - "────────────────────────────────────────────────────────────────────────────────────────────────────────"
          - "{{ recent_errors.stdout.split('\n') | default(['No recent errors']) }}"
          - ""
          - "========================================================================================================"
          - "Report Generated: {{ ansible_date_time.iso8601 }}"
          - "========================================================================================================"

    - name: Create Health Check Summary File
      ansible.builtin.copy:
        content: |
          Azure Infrastructure Health Audit - {{ ansible_hostname }}
          Generated: {{ ansible_date_time.iso8601 }}
          
          CONNECTIVITY: {{ 'OK' if ping_result.ping == 'pong' else 'FAILED' }}
          DISK STATUS: {{ disk_status }}
          UPTIME: {{ uptime_output.stdout }}
          MEMORY: {{ memory_output.stdout }}
          LOAD: {{ loadavg_output.stdout }}
          FAILED SERVICES: {{ failed_services.stdout | default('None') }}
          SECURITY UPDATES: {{ security_updates.stdout }}
        dest: "/tmp/health_audit_{{ ansible_hostname }}_{{ ansible_date_time.epoch }}.txt"
        mode: '0644'
      become: true
