---
# =============================================================================
# Ansible Galaxy Collection Requirements (Legacy - All Collections)
# ============================================================================
# This file includes ALL collections. For faster AWX sync, use split files:
#
# - requirements-core.yml        (ansible.posix, community.general)
# - requirements-azure.yml        (azure.azcollection)
# - requirements-aws.yml          (amazon.aws)
# - requirements-vmware.yml       (community.vmware)
# - requirements-servicenow.yml    (servicenow.itsm)
# - requirements-nmon.yml          (NO collections - built-in modules only)
#
# Usage Examples:
# ansible-galaxy collection install -r collections/requirements-core.yml
# ansible-galaxy collection install -r collections/requirements-core.yml -r collections/requirements-azure.yml
#
# AWX Configuration:
# - Set AWX project to use requirements-core.yml for 66% faster syncs
# - For nmon-only projects, use requirements-nmon.yml (or leave blank) for fastest syncs
# - Only add cloud-specific requirements when needed
# =============================================================================

collections:
  - name: ansible.posix
    version: ">=1.5.4"

  - name: community.general
    version: ">=8.0.0"

  - name: azure.azcollection
    version: ">=2.0.0"

  - name: amazon.aws
    version: ">=6.0.0"

  - name: community.vmware
    version: ">=3.8.0"

  - name: servicenow.itsm
    version: ">=2.2.0"
