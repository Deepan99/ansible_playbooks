---
# =============================================================================
# Playbook: Verify nmon Performance Monitoring Tool (Zero-Secret Enterprise)
# Security: Credentials via AWX env vars (SN_INSTANCE, SN_USERNAME, SN_PASSWORD)
# =============================================================================

# Play 1: Build dynamic inventory from ServiceNow targets
- name: 1. Build Runtime Dynamic Inventory
  hosts: localhost
  gather_facts: false
  vars:
    raw_targets: "{{ target_server | default(target_host | default('')) }}"
  tasks:
    - name: 1.1 Inspect incoming payload
      ansible.builtin.debug:
        msg: "Targets: '{{ raw_targets }}' | RITM: '{{ ritm_number | default('None') }}'"

    - name: 1.2 Validate target parameter
      ansible.builtin.assert:
        that:
          - raw_targets | string | trim | length > 0
        fail_msg: "Mandatory parameter 'target_server' was not provided."

    - name: 1.3 Split comma-separated server names
      ansible.builtin.set_fact:
        target_list: "{{ raw_targets | string | split(',') | map('trim') | reject('equalto', '') | list }}"

    - name: 1.4 Validate hostname format
      ansible.builtin.assert:
        that:
          - item is match('^[a-zA-Z0-9\-\.]+$')
        fail_msg: "Invalid hostname format: {{ item }}"
      loop: "{{ target_list }}"

    - name: 1.5 Register servers into dynamic group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: dynamic_targets
        ansible_ssh_timeout: 15
      loop: "{{ target_list }}"

    - name: 1.6 Verify targets registered
      ansible.builtin.assert:
        that:
          - groups['dynamic_targets'] is defined
          - groups['dynamic_targets'] | length > 0
        fail_msg: "No valid targets registered"

# Play 2: Audit nmon on all targets
- name: 2. Audit nmon Installation and Status
  hosts: dynamic_targets
  gather_facts: true
  roles:
    - nmon_check

# Play 3: Update ServiceNow RITM
- name: 3. Update ServiceNow Ticket Lifecycle
  hosts: localhost
  gather_facts: false
  roles:
    - servicenow_ritm_update
