---
# =============================================================================
# Playbook: Verify nmon Performance Monitoring Tool (Zero-Credential Dynamic Group)
#
# Production Design:
#   - Zero Credentials in Code: 100% decoupled from any API / passwords.
#   - Dynamic In-Memory Inventory: Injects server names passed from ServiceNow.
#   - Input format expected from ServiceNow: Comma-separated (e.g. "node1,node2,master")
#   - Audits all selected targets in parallel.
# =============================================================================

# -----------------------------------------------------------------------------
# Play 1: Register comma-separated target hosts into dynamic execution group
# -----------------------------------------------------------------------------
- name: 1. Build Runtime Dynamic Inventory from ServiceNow
  hosts: localhost
  gather_facts: false
  vars:
    raw_targets: "{{ target_server | default(target_host | default('')) }}"
  tasks:
    - name: 1.1 Validate incoming target parameter
      ansible.builtin.assert:
        that:
          - raw_targets | string | trim | length > 0
        fail_msg: "Mandatory parameter 'target_server' was not provided."

    - name: 1.2 Split comma-separated server names into execution list
      ansible.builtin.set_fact:
        target_list: "{{ raw_targets | string | split(',') | map('trim') | reject('equalto', '') | list }}"

    - name: 1.3 Validate hostname format
      ansible.builtin.assert:
        that:
          - item is match('^[a-zA-Z0-9\-\.]+$')
        fail_msg: "Invalid hostname format: {{ item }}. Expected alphanumeric with hyphens and dots only."
        success_msg: "Hostname format valid: {{ item }}"
      loop: "{{ target_list }}"

    - name: 1.4 Register each server into dynamic runtime execution group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: dynamic_targets
        ansible_ssh_timeout: 15
      loop: "{{ target_list }}"
      register: add_host_result

    - name: 1.5 Verify at least one target was registered
      ansible.builtin.assert:
        that:
          - groups['dynamic_targets'] is defined
          - groups['dynamic_targets'] | length > 0
        fail_msg: "No valid targets were registered. Check target_server parameter and hostname format."
        success_msg: "Successfully registered {{ groups['dynamic_targets'] | length }} target(s)"

    - name: 1.6 Display targets registered for this audit run
      ansible.builtin.debug:
        msg: "Dynamically registered {{ groups['dynamic_targets'] | length }} target(s): {{ groups['dynamic_targets'] }}"

# -----------------------------------------------------------------------------
# Play 2: Audit all dynamic targets in parallel using nmon_check role
# -----------------------------------------------------------------------------
- name: 2. Audit nmon Installation, Version, and Running Status
  hosts: dynamic_targets
  gather_facts: true
  roles:
    - role: nmon_check
