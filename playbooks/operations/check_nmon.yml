---
# =============================================================================
# Playbook: Verify nmon Performance Monitoring Tool (Zero-Secret Enterprise)
#
# Security Standard:
#   - ZERO passwords, usernames, or instances in code.
#   - Credentials injected securely via AWX / AAP environment variables:
#     SN_INSTANCE, SN_USERNAME, SN_PASSWORD
# =============================================================================

# -----------------------------------------------------------------------------
# Play 1: Register comma-separated target hosts into dynamic execution group
# -----------------------------------------------------------------------------
- name: 1. Build Runtime Dynamic Inventory from ServiceNow
  hosts: localhost
  gather_facts: false
  vars:
    raw_targets: "{{ target_server | default(target_host | default('')) }}"
  tasks:
    - name: 1.1 Inspect incoming target payload from ServiceNow
      ansible.builtin.debug:
        msg: "Received targets: '{{ raw_targets }}' | RITM: '{{ ritm_number | default('None') }}'"

    - name: 1.2 Validate incoming target parameter
      ansible.builtin.assert:
        that:
          - raw_targets | string | trim | length > 0
        fail_msg: "Mandatory parameter 'target_server' was not provided."

    - name: 1.3 Split comma-separated server names into execution list
      ansible.builtin.set_fact:
        target_list: "{{ raw_targets | string | split(',') | map('trim') | reject('equalto', '') | list }}"

    - name: 1.4 Validate hostname format
      ansible.builtin.assert:
        that:
          - item is match('^[a-zA-Z0-9\-\.]+$')
        fail_msg: "Invalid hostname format: {{ item }}. Expected alphanumeric with hyphens and dots only."
        success_msg: "Hostname format valid: {{ item }}"
      loop: "{{ target_list }}"

    - name: 1.5 Register each server into dynamic runtime execution group
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: dynamic_targets
        ansible_ssh_timeout: 15
      loop: "{{ target_list }}"
      register: add_host_result

    - name: 1.6 Verify at least one target was registered
      ansible.builtin.assert:
        that:
          - groups['dynamic_targets'] is defined
          - groups['dynamic_targets'] | length > 0
        fail_msg: "No valid targets were registered. Check target_server parameter and hostname format."
        success_msg: "Successfully registered {{ groups['dynamic_targets'] | length }} target(s)"

    - name: 1.7 Display targets registered for this audit run
      ansible.builtin.debug:
        msg: "Dynamically registered {{ groups['dynamic_targets'] | length }} target(s): {{ groups['dynamic_targets'] }}"

# -----------------------------------------------------------------------------
# Play 2: Audit all dynamic targets in parallel using nmon_check role
# -----------------------------------------------------------------------------
- name: 2. Audit nmon Installation, Version, and Running Status
  hosts: dynamic_targets
  gather_facts: true
  roles:
    - role: nmon_check

# -----------------------------------------------------------------------------
# Play 3: Enterprise Final Handshake - Update ServiceNow RITM
# -----------------------------------------------------------------------------
- name: 3. Final Handshake - Update ServiceNow Ticket Lifecycle
  hosts: localhost
  gather_facts: false
  vars:
    # Securely read from AWX injected environment variables (NO credentials in code)
    sn_instance: "{{ lookup('env', 'SN_INSTANCE') }}"
    sn_username: "{{ lookup('env', 'SN_USERNAME') }}"
    sn_password: "{{ lookup('env', 'SN_PASSWORD') }}"
    ritm_id: "{{ ritm_number | default('') }}"
  tasks:
    - name: 3.1 Check if ServiceNow fulfillment was requested
      ansible.builtin.debug:
        msg: "ServiceNow RITM: {{ ritm_id if ritm_id != '' else 'None (Manual Run - Skipping ServiceNow Update)' }}"

    - name: 3.2 Process ServiceNow Ticket Lifecycle Updates
      when:
        - ritm_id != ''
        - sn_instance != ''
        - sn_username != ''
      block:
        # Collect results from all audited hosts
        - name: 3.2.1 Consolidate multi-host audit findings
          ansible.builtin.set_fact:
            all_hosts_verified: "{{ groups['dynamic_targets'] | map('extract', hostvars, 'nmon_installed') | select('equalto', true) | list | length == (groups['dynamic_targets'] | length) }}"
            consolidated_report: >-
              {% for h in groups['dynamic_targets'] %}
              • {{ hostvars[h]['nmon_report'] | default(h + ': Audit completed') }}
              {% endfor %}

        # Query RITM sys_id
        - name: 3.2.2 Query sys_id for ticket {{ ritm_id }}
          ansible.builtin.uri:
            url: "https://{{ sn_instance }}/api/now/table/sc_req_item?sysparm_query=number={{ ritm_id }}&sysparm_fields=sys_id"
            method: GET
            url_username: "{{ sn_username }}"
            url_password: "{{ sn_password }}"
            force_basic_auth: true
            headers:
              Accept: application/json
          register: ritm_lookup
          ignore_errors: true

        - name: 3.2.3 Extract RITM sys_id
          ansible.builtin.set_fact:
            ritm_sys_id: "{{ ritm_lookup.json.result[0].sys_id }}"
          when:
            - ritm_lookup.json is defined
            - ritm_lookup.json.result | default([]) | length > 0

        # Query Linux Support group sys_id (for reassignment if missing)
        - name: 3.2.4 Query Linux Support assignment group sys_id
          ansible.builtin.uri:
            url: "https://{{ sn_instance }}/api/now/table/sys_user_group?sysparm_query=name=Linux Support&sysparm_fields=sys_id"
            method: GET
            url_username: "{{ sn_username }}"
            url_password: "{{ sn_password }}"
            force_basic_auth: true
            headers:
              Accept: application/json
          register: group_lookup
          when:
            - ritm_sys_id is defined
            - not all_hosts_verified | bool
          ignore_errors: true

        - name: 3.2.5 Set Linux Support sys_id
          ansible.builtin.set_fact:
            linux_support_id: "{{ group_lookup.json.result[0].sys_id | default('') }}"
          when:
            - not all_hosts_verified | bool
            - group_lookup.json is defined
            - group_lookup.json.result | default([]) | length > 0

        # Case A: All hosts verified -> Auto-close Complete
        - name: 3.2.6 Auto-Close Ticket (All Targets Verified)
          ansible.builtin.uri:
            url: "https://{{ sn_instance }}/api/now/table/sc_req_item/{{ ritm_sys_id }}"
            method: PATCH
            url_username: "{{ sn_username }}"
            url_password: "{{ sn_password }}"
            force_basic_auth: true
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              state: "3"  # Closed Complete
              stage: "complete"
              work_notes: >-
                [Ansible Automation - SUCCESS]
                All requested target servers have been verified:
                {{ consolidated_report }}
                Ticket automatically Closed Complete.
          when:
            - ritm_sys_id is defined
            - all_hosts_verified | bool

        # Case B: Any host missing -> Assign to Linux Support (Work in Progress)
        - name: 3.2.7 Reassign to Linux Support (Remediation Required)
          ansible.builtin.uri:
            url: "https://{{ sn_instance }}/api/now/table/sc_req_item/{{ ritm_sys_id }}"
            method: PATCH
            url_username: "{{ sn_username }}"
            url_password: "{{ sn_password }}"
            force_basic_auth: true
            headers:
              Content-Type: application/json
              Accept: application/json
            body_format: json
            body:
              state: "2"  # Work in Progress
              stage: "in_progress"
              assignment_group: "{{ linux_support_id | default('') }}"
              work_notes: >-
                [Ansible Automation - ACTION REQUIRED]
                nmon verification detected missing installation or inactive service:
                {{ consolidated_report }}
                Ticket has been reassigned to 'Linux Support' team for remediation.
          when:
            - ritm_sys_id is defined
            - not all_hosts_verified | bool

        - name: 3.2.8 Log Final Handshake Confirmation
          ansible.builtin.debug:
            msg: >-
              ServiceNow {{ ritm_id }} updated successfully:
              {{ 'Closed Complete' if all_hosts_verified else 'Reassigned to Linux Support (Work in Progress)' }}
