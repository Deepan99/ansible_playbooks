---
# =============================================================================
# Role: nmon_check - Enterprise Audit & Reporting
# Purpose: Inspects installation, version, and running status (systemd/process)
# Output: Returns structured facts and set_stats for ServiceNow
# =============================================================================

# -----------------------------------------------------------------------------
# 0. OS Detection
# -----------------------------------------------------------------------------
- name: 0.1 Detect init system
  ansible.builtin.set_fact:
    init_system: >-
      {{ 'systemd'
         if (ansible_facts['os_family'] in ['RedHat', 'Debian'])
         else 'other' }}
  when: ansible_facts['os_family'] is defined

# -----------------------------------------------------------------------------
# 1. Installation Status Check
# -----------------------------------------------------------------------------
- name: 1.1 Detect nmon binary from multiple possible paths
  ansible.builtin.stat:
    path: "{{ item }}"
  register: nmon_stat
  loop: "{{ nmon_binary_paths }}"
  failed_when: false
  changed_when: false

- name: 1.2 Set installation flag and binary path
  ansible.builtin.set_fact:
    nmon_installed: "{{ item.stat.exists | default(false) }}"
    nmon_binary_path: "{{ item.item }}"
  loop: "{{ nmon_stat.results }}"
  when: item.stat.exists | default(false)
  run_once: true

- name: 1.3 Set installation flag to false if not found
  ansible.builtin.set_fact:
    nmon_installed: false
    nmon_binary_path: "{{ nmon_binary_paths[0] }}"
  when: nmon_installed is not defined

# -----------------------------------------------------------------------------
# 2. Version Detection (Executed if installed)
# -----------------------------------------------------------------------------
- name: 2.1 Query nmon version string
  ansible.builtin.command: "{{ nmon_binary_path }} -V"
  register: nmon_version_cmd
  changed_when: false
  failed_when: false
  when: nmon_installed | bool

- name: 2.2 Parse version fact
  ansible.builtin.set_fact:
    nmon_version: >-
      {{ (nmon_version_cmd.stdout_lines | first | default('Unknown'))
         if (nmon_installed and nmon_version_cmd.stdout_lines | length > 0)
         else 'Not Installed' }}

# -----------------------------------------------------------------------------
# 3. Running Status Check (Dual-mode: systemd service + background process)
# -----------------------------------------------------------------------------
- name: 3.1 Collect systemd service facts (if systemd detected)
  ansible.builtin.service_facts:
  register: service_facts_result
  failed_when: false
  when: init_system == 'systemd'

- name: 3.2 Check background process table for nmon
  ansible.builtin.command: pgrep -x nmon
  register: nmon_proc_cmd
  changed_when: false
  failed_when: false

- name: 3.3 Consolidate running state
  ansible.builtin.set_fact:
    nmon_running: >-
      {{ (ansible_facts.services['nmon.service']['state'] == 'running')
         if (init_system == 'systemd'
            and ansible_facts.services is defined
            and 'nmon.service' in ansible_facts.services)
         else (nmon_proc_cmd.rc == 0) }}
    nmon_running_mode: >-
      {{ 'systemd service'
         if (init_system == 'systemd'
            and ansible_facts.services is defined
            and 'nmon.service' in ansible_facts.services
            and ansible_facts.services['nmon.service']['state'] == 'running')
         else ('background process' if nmon_proc_cmd.rc == 0 else 'inactive') }}

# -----------------------------------------------------------------------------
# 4. Construct Audit Summary & Expose via set_stats
# -----------------------------------------------------------------------------
- name: 4.1 Construct verification summary
  ansible.builtin.set_fact:
    nmon_report: >-
      Target: {{ inventory_hostname }} |
      Installed: {{ 'YES' if nmon_installed else 'NO' }} |
      Version: {{ nmon_version }} |
      Running Status: {{ 'ACTIVE (' + nmon_running_mode + ')' if nmon_running else 'INACTIVE' }}

- name: 4.2 Display verification report
  ansible.builtin.debug:
    msg: "{{ nmon_report }}"

- name: 4.3 Expose structured facts to AWX & ServiceNow Flow
  ansible.builtin.set_stats:
    data:
      nmon_installed: "{{ nmon_installed }}"
      nmon_version: "{{ nmon_version }}"
      nmon_running: "{{ nmon_running }}"
      nmon_report: "{{ nmon_report }}"
