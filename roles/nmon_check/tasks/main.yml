---
# =============================================================================
# Role: nmon_check - Pure Enterprise Audit & Reporting
# Purpose: Inspects target host across any Linux OS and records status cleanly
# =============================================================================

- name: 1. Inspect standard binary paths for nmon executable
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /usr/bin/nmon
    - /usr/local/bin/nmon
    - /bin/nmon
    - /usr/sbin/nmon
    - /opt/nmon/bin/nmon
  register: nmon_binary_stat
  changed_when: false

- name: 2. Evaluate binary existence across inspected paths
  ansible.builtin.set_fact:
    nmon_binary_found: "{{ (nmon_binary_stat.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists', 'equalto', true) | list | length) > 0 }}"
    nmon_binary_path: "{{ (nmon_binary_stat.results | selectattr('stat.exists', 'defined') | selectattr('stat.exists', 'equalto', true) | map(attribute='item') | first) | default('') }}"

- name: 3. Query OS package inventory natively (RHEL, Ubuntu, Debian, SUSE)
  ansible.builtin.package_facts:
    manager: auto
  register: pkg_facts_result
  ignore_errors: true

- name: 4. Determine if nmon package is registered in OS inventory
  ansible.builtin.set_fact:
    nmon_package_found: "{{ 'nmon' in ansible_facts.packages }}"
  when: ansible_facts.packages is defined

- name: 5. Default package status if package_facts manager failed
  ansible.builtin.set_fact:
    nmon_package_found: false
  when: ansible_facts.packages is not defined

- name: 6. Consolidate installation status into verified fact
  ansible.builtin.set_fact:
    nmon_is_installed: "{{ nmon_binary_found | bool or nmon_package_found | bool }}"

- name: 7. Construct human-readable verification report
  ansible.builtin.set_fact:
    nmon_verification_summary: >-
      Host: {{ inventory_hostname }} |
      OS: {{ ansible_facts['distribution'] | default('Linux') }} {{ ansible_facts['distribution_version'] | default('') }} |
      Domain: {{ ansible_facts['domain'] | default('default') }} |
      Status: {{ 'INSTALLED' if nmon_is_installed else 'NOT INSTALLED' }} |
      Binary: {{ nmon_binary_path | default('None') }}

- name: 8. Log verification summary report
  ansible.builtin.debug:
    msg: "{{ nmon_verification_summary }}"
