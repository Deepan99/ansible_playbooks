---
- name: Enterprise Atomic Kernel Patching & Audit (Level 5 ARM API)
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
    azure_sub_id: "{{ lookup('env', 'AZURE_SUBSCRIPTION_ID') }}"
    azure_client_id: "{{ lookup('env', 'AZURE_CLIENT_ID') }}"
    azure_secret: "{{ lookup('env', 'AZURE_SECRET') }}"
    azure_tenant_id: "{{ lookup('env', 'AZURE_TENANT') }}"
    target_rg: "{{ resource_group | default('rg-spoke-eastus') }}"
    api_timeout: 300

  tasks:
    # -------------------------------------------------------------------------
    # STEP 1: AUTHENTICATE & DISCOVER VMs
    # -------------------------------------------------------------------------
    - name: 1. Obtain Azure OAuth2 Access Token
      ansible.builtin.uri:
        url: "https://login.microsoftonline.com/{{ azure_tenant_id }}/oauth2/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: "client_credentials"
          client_id: "{{ azure_client_id }}"
          client_secret: "{{ azure_secret }}"
          resource: "https://management.azure.com/"
        status_code: [200]
      register: token_resp
      no_log: true

    - name: 2. Discover Target Spoke VMs
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ azure_sub_id }}/resourceGroups/{{ target_rg }}/providers/Microsoft.Compute/virtualMachines?api-version=2023-09-01"
        method: GET
        headers:
          Authorization: "Bearer {{ token_resp.json.access_token }}"
      register: vms_resp

    - name: 2.1. Confirm VM Discovery
      ansible.builtin.debug:
        msg: "Discovered {{ vms_resp.json.value | length }} VM(s) in Resource Group {{ target_rg }}"

    # -------------------------------------------------------------------------
    # STEP 2: STRICT IDEMPOTENT PATCHING & CONDITIONAL REBOOT
    # -------------------------------------------------------------------------
    - name: 3. Execute Strict Idempotent Patch & Conditional Reboot
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ azure_sub_id }}/resourceGroups/{{ target_rg }}/providers/Microsoft.Compute/virtualMachines/{{ item.name }}/runCommand?api-version=2023-09-01"
        method: POST
        headers:
          Authorization: "Bearer {{ token_resp.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          commandId: "RunShellScript"
          script:
            - "OLD_KERNEL=$(uname -r)"
            - "echo \"=== CURRENT ACTIVE KERNEL: $OLD_KERNEL ===\""
            - "dnf update -y kernel kernel-core kernel-modules kernel-devel dnf-utils"
            - "NEWEST_INSTALLED=$(rpm -q kernel --queryformat '%{VERSION}-%{RELEASE}.%{ARCH}\n' | tail -1)"
            - "echo \"=== NEWEST INSTALLED KERNEL: $NEWEST_INSTALLED ===\""
            - "if [ \"$OLD_KERNEL\" != \"$NEWEST_INSTALLED\" ] && ! needs-restarting -r > /dev/null 2>&1; then echo 'REBOOT_REQUIRED: New kernel installed. Rebooting in 5s...'; (sleep 5 && shutdown -r now 'Ansible Kernel Patch Reboot') & else echo 'NO_REBOOT_REQUIRED: System is already on latest kernel. Skipping reboot.'; fi"
        status_code: [200, 202]
      loop: "{{ vms_resp.json.value }}"
      loop_control:
        label: "{{ item.name }}"
      register: atomic_patch_results

    # -------------------------------------------------------------------------
    # STEP 3: SMART VM PROVISIONING STATE WAIT (ZERO GUESSWORK)
    # -------------------------------------------------------------------------
    - name: 4. Poll Azure ARM API Until All VMs Reach ProvisioningState Succeeded
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ azure_sub_id }}/resourceGroups/{{ target_rg }}/providers/Microsoft.Compute/virtualMachines/{{ item.name }}?api-version=2023-09-01"
        method: GET
        headers:
          Authorization: "Bearer {{ token_resp.json.access_token }}"
        status_code: [200]
      loop: "{{ vms_resp.json.value }}"
      loop_control:
        label: "{{ item.name }}"
      register: vm_state_resp
      retries: 15
      delay: 20
      until: vm_state_resp.json.properties.provisioningState == "Succeeded"

    # -------------------------------------------------------------------------
    # STEP 4: POST-CHECK & AUDIT REPORT
    # -------------------------------------------------------------------------
    - name: 5. Execute Post-Check Verification
      ansible.builtin.uri:
        url: "https://management.azure.com/subscriptions/{{ azure_sub_id }}/resourceGroups/{{ target_rg }}/providers/Microsoft.Compute/virtualMachines/{{ item.name }}/runCommand?api-version=2023-09-01"
        method: POST
        headers:
          Authorization: "Bearer {{ token_resp.json.access_token }}"
          Content-Type: "application/json"
        body_format: json
        body:
          commandId: "RunShellScript"
          script:
            - "echo '=== POST-PATCH AUDIT ==='"
            - "echo \"Active Kernel: $(uname -r)\""
            - "echo \"System Uptime: $(uptime -p)\""
            - "echo '=== AUDIT COMPLETE ==='"
        status_code: [200, 202]
      loop: "{{ vms_resp.json.value }}"
      loop_control:
        label: "{{ item.name }}"
      register: post_verify_results

    - name: 6. AUDIT SUMMARY REPORT
      ansible.builtin.debug:
        msg:
          - "================================================="
          - "   ENTERPRISE KERNEL PATCHING AUDIT REPORT        "
          - "================================================="
          - "Resource Group: {{ target_rg }}"
          - "Total VMs Processed: {{ vms_resp.json.value | length }}"
          - "Execution Mode: Level 5 Zero-Trust ARM API"
          - "Smart Reboot: Enabled (Reboots ONLY when kernel updates)"
          - "-------------------------------------------------"
          - "{% for res in post_verify_results.results %} VM: {{ res.item.name }} | Status: VERIFIED & ONLINE {% endfor %}"
          - "================================================="
