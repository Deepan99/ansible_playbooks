---
- name: Change User Password Safely
  hosts: all
  become: true
  vars:
    target_username: "alice"
    # Plain text password (in production, use Ansible Vault to encrypt this)
    new_plain_password: "MyNewSecurePassword123!"

  tasks:
    - name: Update user password (automatically hashed using SHA-512)
      ansible.builtin.user:
        name: "{{ target_username }}"
        # Linux /etc/shadow requires passwords to be hashed.
        # The password_hash filter generates a secure hash on the control node.
        password: "{{ new_plain_password | password_hash('sha512') }}"
        update_password: on_create  # Change to "always" if you want to enforce password update on every run
