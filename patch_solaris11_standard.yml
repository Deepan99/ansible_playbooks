---
- name: Standard Solaris 11 System Patching Playbook
  hosts: all
  become: true
  tasks:
    # ------------------
    # PHASE 1: PRE-CHECKS
    # ------------------
    - name: Pre-check - Get current boot environment (BE) status
      ansible.builtin.command: "beadm list"
      register: pre_be_list
      changed_when: false

    - name: Display current boot environments
      ansible.builtin.debug:
        var: pre_be_list.stdout_lines

    # ------------------
    # PHASE 2: UPGRADE
    # ------------------
    - name: Execute Solaris pkg update
      # pkg update automatically handles licenses and creates a new boot environment
      ansible.builtin.command: "pkg update --accept --be-name ansible-patching-BE"
      register: pkg_update_result
      failed_when:
        - pkg_update_result.rc != 0
        # Ignore return code 4 which means "No updates available"
        - pkg_update_result.rc != 4

    # ------------------
    # PHASE 3: REBOOT
    # ------------------
    - name: Reboot Solaris server to activate the new boot environment
      ansible.builtin.reboot:
        msg: "Rebooting Solaris system to activate new boot environment"
        reboot_timeout: 900 # Solaris can take longer to boot than Linux
      when: pkg_update_result.changed or "Create Value" in pkg_update_result.stdout

    - name: Wait for server connection to be restored
      ansible.builtin.wait_for_connection:
        timeout: 600

    # ------------------
    # PHASE 4: POST-CHECKS
    # ------------------
    - name: Post-check - Retrieve boot environment list
      ansible.builtin.command: "beadm list"
      register: post_be_list
      changed_when: false

    - name: Verify that the new boot environment is active on next boot (marked as 'R')
      ansible.builtin.assert:
        that:
          - "'ansible-patching-BE' in post_be_list.stdout"
        fail_msg: "Post-check failed: The new boot environment 'ansible-patching-BE' is not active."
